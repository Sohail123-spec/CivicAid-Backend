spring.application.name=civicaid-backend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/civicaid
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the maintained schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=civicaid-backend

# Security defaults (never commit secret values)
# Set JWT_SECRET in the environment before running the app.

# Server
server.port=8080
