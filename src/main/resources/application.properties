spring.application.name=civicaid-backend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/civicaid
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the maintained schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=civicaid-backend

# Security defaults (never commit secret values)
# Set JWT_SECRET in the environment before running the app.

# Server
server.port=8080

# CORS configuration (supports local development origins and configurable production overrides)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://localhost:[*],http://127.0.0.1:[*]}
